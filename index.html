<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vent Then Burn - AppADay 121</title>
<style>
  :root{
    --bg:#141110;
    --panel:#1d1917;
    --ash:#8a8580;
    --ember1:#ff7a2e;
    --ember2:#ff2e2e;
    --text:#ece7e2;
    --muted:#9a938c;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  body{
    min-height:100dvh;
    display:flex;
    flex-direction:column;
  }
  header,footer{
    padding:14px 16px;
    text-align:center;
    font-size:13px;
  }
  header{
    border-bottom:1px solid #2a2523;
  }
  footer{
    border-top:1px solid #2a2523;
    color:var(--muted);
  }
  a.backlink{
    color:var(--ember1);
    text-decoration:none;
  }
  a.backlink:hover{
    text-decoration:underline;
  }
  .app-title{
    font-weight:600;
    letter-spacing:0.02em;
  }
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    gap:16px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:560px;
  }
  textarea{
    width:100%;
    min-height:240px;
    background:var(--panel);
    color:var(--text);
    border:1px solid #332d2a;
    border-radius:10px;
    padding:16px;
    font-size:16px;
    line-height:1.5;
    resize:vertical;
    font-family:inherit;
  }
  textarea:focus{
    outline:none;
    border-color:var(--ember1);
  }
  canvas{
    display:block;
    width:100%;
    height:240px;
    background:var(--panel);
    border:1px solid #332d2a;
    border-radius:10px;
  }
  .hidden{
    display:none !important;
  }
  .controls{
    width:100%;
    max-width:560px;
    display:flex;
    justify-content:center;
  }
  button#releaseBtn{
    min-height:48px;
    padding:0 28px;
    font-size:16px;
    font-weight:600;
    color:#1a1310;
    background:linear-gradient(180deg,var(--ember1),var(--ember2));
    border:none;
    border-radius:999px;
    cursor:pointer;
    letter-spacing:0.02em;
  }
  button#releaseBtn:disabled{
    opacity:0.5;
    cursor:default;
  }
  .privacy-note{
    max-width:560px;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
  .affirm{
    max-width:560px;
    text-align:center;
    font-size:17px;
    color:var(--text);
    min-height:24px;
    opacity:0;
    transition:opacity 1.1s ease;
  }
  .affirm.show{
    opacity:1;
  }
</style>
</head>
<body>

<header>
  <span class="app-title">121. Vent Then Burn</span>
  &nbsp;-&nbsp;
  <a class="backlink" href="https://augustineiacopelli.github.io/appaday/">AppADay Portfolio</a>
</header>

<main>
  <div class="stage">
    <textarea id="ventText" placeholder="Write what you need to let go of..." spellcheck="false"></textarea>
    <canvas id="burnCanvas" class="hidden"></canvas>
  </div>

  <div class="controls">
    <button id="releaseBtn">Release It</button>
  </div>

  <p class="privacy-note">Nothing you type here is stored, saved, or sent anywhere. It only exists until you burn it.</p>

  <p class="affirm" id="affirmLine"></p>
</main>

<footer>
  <a class="backlink" href="https://augustineiacopelli.github.io/appaday/">https://augustineiacopelli.github.io/appaday/</a>
</footer>

<script>
(function(){
  "use strict";

  var textarea = document.getElementById("ventText");
  var canvas = document.getElementById("burnCanvas");
  var releaseBtn = document.getElementById("releaseBtn");
  var affirmLine = document.getElementById("affirmLine");
  var ctx = canvas.getContext("2d");

  var BURN_MS = 4200;
  var SAMPLE_STRIDE = 4;
  var MAX_PARTICLES = 2200;

  var AFFIRMATIONS = [
    "Let it go.",
    "It's ash now.",
    "Released.",
    "Gone. That's it.",
    "Nothing left to carry.",
    "Burned, not buried."
  ];

  var particles = [];
  var burning = false;
  var burnStart = 0;
  var affirmShown = false;

  var canvasW = 0;
  var canvasH = 0;

  function dpr(){
    return Math.max(1, window.devicePixelRatio || 1);
  }

  function applyCanvasSize(width, height){
    if(width <= 0 || height <= 0) return;
    var ratio = dpr();
    canvasW = width;
    canvasH = height;
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";
    canvas.width = Math.floor(width * ratio);
    canvas.height = Math.floor(height * ratio);
  }

  function wrapText(offCtx, text, maxWidth, lineHeight){
    var words = text.split(/\s+/).filter(function(w){ return w.length > 0; });
    var rawLines = text.split("\n");
    var lines = [];
    rawLines.forEach(function(raw){
      var lineWords = raw.split(/\s+/).filter(function(w){ return w.length > 0; });
      if(lineWords.length === 0){
        lines.push("");
        return;
      }
      var current = "";
      lineWords.forEach(function(word){
        var test = current.length ? current + " " + word : word;
        if(offCtx.measureText(test).width > maxWidth && current.length){
          lines.push(current);
          current = word;
        } else {
          current = test;
        }
      });
      if(current.length){
        lines.push(current);
      }
    });
    return lines;
  }

  function sampleTextToPoints(text, width, height){
    var off = document.createElement("canvas");
    var ratio = dpr();
    off.width = Math.floor(width * ratio);
    off.height = Math.floor(height * ratio);
    var offCtx = off.getContext("2d");
    offCtx.scale(ratio, ratio);
    offCtx.fillStyle = "#000000";
    offCtx.fillRect(0, 0, width, height);
    offCtx.fillStyle = "#ffffff";
    var fontSize = 16;
    offCtx.font = fontSize + "px -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif";
    offCtx.textBaseline = "top";

    var padding = 16;
    var maxWidth = width - padding * 2;
    var lineHeight = fontSize * 1.5;
    var lines = wrapText(offCtx, text, maxWidth, lineHeight);

    var maxLines = Math.floor((height - padding * 2) / lineHeight);
    if(lines.length > maxLines && maxLines > 0){
      lines = lines.slice(0, maxLines);
    }

    lines.forEach(function(line, i){
      offCtx.fillText(line, padding, padding + i * lineHeight);
    });

    var imgData = offCtx.getImageData(0, 0, off.width, off.height).data;
    var points = [];
    var stride = SAMPLE_STRIDE * ratio;
    for(var y = 0; y < off.height; y += stride){
      for(var x = 0; x < off.width; x += stride){
        var idx = (Math.floor(y) * off.width + Math.floor(x)) * 4;
        var alpha = imgData[idx + 3];
        if(alpha > 80){
          points.push({ x: x / ratio, y: y / ratio });
        }
      }
    }

    if(points.length > MAX_PARTICLES){
      var picked = [];
      var stepPick = points.length / MAX_PARTICLES;
      for(var p = 0; p < MAX_PARTICLES; p++){
        picked.push(points[Math.floor(p * stepPick)]);
      }
      points = picked;
    }

    return points;
  }

  function makeParticles(points){
    return points.map(function(pt){
      var life = 2200 + Math.random() * (BURN_MS - 1800);
      return {
        x: pt.x,
        y: pt.y,
        vx: (Math.random() - 0.5) * 0.35,
        vy: -(0.4 + Math.random() * 0.9),
        gravity: 0.006 + Math.random() * 0.01,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.03,
        size: 1.4 + Math.random() * 2.2,
        life: life,
        age: Math.random() * 250,
        delay: Math.random() * 500
      };
    });
  }

  function colorForProgress(t){
    if(t < 0.2){
      var g = 220 - t / 0.2 * 40;
      return "rgba(" + Math.floor(g) + "," + Math.floor(g) + "," + Math.floor(g * 0.95) + ",";
    } else if(t < 0.65){
      var k = (t - 0.2) / 0.45;
      var r1 = 200 + k * 55;
      var g1 = 180 - k * 100;
      var b1 = 170 - k * 130;
      return "rgba(" + Math.floor(r1) + "," + Math.floor(g1) + "," + Math.floor(b1) + ",";
    } else {
      var k2 = (t - 0.65) / 0.35;
      var r2 = 255 - k2 * 30;
      var g2 = 80 - k2 * 60;
      var b2 = 30;
      return "rgba(" + Math.floor(r2) + "," + Math.max(0, Math.floor(g2)) + "," + b2 + ",";
    }
  }

  var audioCtx = null;
  var audioNodes = [];

  function playBurnAudio(durationMs){
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      audioCtx = new AC();

      var now = audioCtx.currentTime;
      var dur = durationMs / 1000;

      var bufferSize = audioCtx.sampleRate * dur;
      var noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      var data = noiseBuffer.getChannelData(0);
      for(var i = 0; i < bufferSize; i++){
        data[i] = (Math.random() * 2 - 1) * (Math.random() < 0.02 ? 1 : 0.15);
      }
      var noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = noiseBuffer;

      var bandpass = audioCtx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = 1800;
      bandpass.Q.value = 0.6;

      var noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.0001, now);
      noiseGain.gain.linearRampToValueAtTime(0.5, now + 0.15);
      noiseGain.gain.linearRampToValueAtTime(0.3, now + dur * 0.7);
      noiseGain.gain.linearRampToValueAtTime(0.0001, now + dur);

      noiseSource.connect(bandpass);
      bandpass.connect(noiseGain);
      noiseGain.connect(audioCtx.destination);

      var drone = audioCtx.createOscillator();
      drone.type = "sine";
      drone.frequency.value = 70;
      var droneGain = audioCtx.createGain();
      droneGain.gain.setValueAtTime(0.0001, now);
      droneGain.gain.linearRampToValueAtTime(0.12, now + 0.3);
      droneGain.gain.linearRampToValueAtTime(0.08, now + dur * 0.6);
      droneGain.gain.linearRampToValueAtTime(0.0001, now + dur);
      drone.connect(droneGain);
      droneGain.connect(audioCtx.destination);

      noiseSource.start(now);
      noiseSource.stop(now + dur);
      drone.start(now);
      drone.stop(now + dur);

      audioNodes = [noiseSource, drone];
    } catch(e){
      audioCtx = null;
    }
  }

  function stopAudio(){
    if(audioCtx){
      try{
        audioCtx.close();
      } catch(e){}
      audioCtx = null;
    }
  }

  function startBurn(){
    var text = textarea.value;
    if(!text || !text.trim().length) return;

    var textRect = textarea.getBoundingClientRect();
    var rectW = textRect.width;
    var rectH = textRect.height;
    applyCanvasSize(rectW, rectH);

    var points = sampleTextToPoints(text, rectW, rectH);
    particles = makeParticles(points);

    textarea.classList.add("hidden");
    canvas.classList.remove("hidden");
    releaseBtn.disabled = true;
    affirmLine.classList.remove("show");
    affirmLine.textContent = "";
    affirmShown = false;

    playBurnAudio(BURN_MS);

    burning = true;
    burnStart = performance.now();
    requestAnimationFrame(animateBurn);
  }

  function animateBurn(now){
    var elapsed = now - burnStart;
    var ratio = dpr();
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    var w = canvas.width / ratio;
    var h = canvas.height / ratio;
    ctx.clearRect(0, 0, w, h);

    var stillAlive = false;

    particles.forEach(function(pt){
      if(elapsed < pt.delay) { stillAlive = true; return; }
      var age = elapsed - pt.delay;
      var t = Math.min(1, age / pt.life);
      if(t >= 1) return;
      stillAlive = true;

      pt.wobble += pt.wobbleSpeed;
      pt.x += pt.vx + Math.sin(pt.wobble) * 0.3;
      pt.vy += pt.gravity * -0.3;
      pt.y += pt.vy;

      var size = pt.size * (1 - t * 0.85);
      if(size < 0.15) size = 0.15;
      var alpha = 1 - Math.pow(t, 1.4);
      var colorPrefix = colorForProgress(t);

      ctx.beginPath();
      ctx.fillStyle = colorPrefix + Math.max(0, alpha) + ")";
      ctx.arc(pt.x, pt.y, size, 0, Math.PI * 2);
      ctx.fill();
    });

    if(elapsed > BURN_MS + 1200 && !affirmShown){
      showAffirmation();
    }

    if(stillAlive || elapsed < BURN_MS + 1500){
      requestAnimationFrame(animateBurn);
    } else {
      finishBurn();
    }
  }

  function showAffirmation(){
    affirmShown = true;
    var line = AFFIRMATIONS[Math.floor(Math.random() * AFFIRMATIONS.length)];
    affirmLine.textContent = line;
    requestAnimationFrame(function(){
      affirmLine.classList.add("show");
    });
  }

  function finishBurn(){
    burning = false;
    stopAudio();
    setTimeout(resetStage, 2200);
  }

  function resetStage(){
    affirmLine.classList.remove("show");
    setTimeout(function(){
      affirmLine.textContent = "";
      textarea.value = "";
      canvas.classList.add("hidden");
      textarea.classList.remove("hidden");
      releaseBtn.disabled = false;
      particles = [];
      var ratio = dpr();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }, 900);
  }

  releaseBtn.addEventListener("click", function(){
    if(burning) return;
    startBurn();
  });

  window.addEventListener("resize", function(){
    if(!canvas.classList.contains("hidden") && canvasH > 0){
      var stageRect = canvas.parentElement.getBoundingClientRect();
      applyCanvasSize(stageRect.width, canvasH);
    }
  });
})();
</script>

</body>
</html>
